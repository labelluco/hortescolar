<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Importar actividades · Huerto escolar</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/registrarServiceWorker.js" defer></script>
</head>
<body>
  <header class="barra">
    <a class="barra-titulo" href="index.html">Huerto escolar</a>
    <nav class="barra-enlaces" id="barraEnlaces"></nav>
  </header>

  <main class="contenido">
    <p><a class="volver" href="actividades.html">← Volver</a></p>
    <h1>Importar actividades</h1>
    <p class="subtitulo">Sube actividades preparadas en un fichero JSON (por ejemplo, los de la carpeta <code>propuestas/</code> del proyecto). Si ya existe una actividad con el mismo id, se sustituye, pero se conservan sus imágenes.</p>

    <section class="tarjeta seccion">
      <label class="boton">
        Elegir ficheros JSON…
        <input type="file" id="ficheros" accept=".json,application/json" multiple hidden>
      </label>
      <div id="vistaPrevia"></div>
      <p class="error" id="error" role="alert"></p>
      <button type="button" class="boton boton-principal" id="botonSubir" hidden>Subir</button>
    </section>
  </main>

  <script type="module" src="js/interfaz/importar.js"></script>
</body>
</html>
