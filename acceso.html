<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso profesorado · Huerto escolar</title>
  <link rel="icon" href="img/abella.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/registrarServiceWorker.js" defer></script>
</head>
<body>
  <header class="barra">
    <a class="barra-titulo" href="index.html"><img src="img/abella.svg" alt="" width="32" height="32">Huerto escolar</a>
  </header>

  <main class="contenido">
    <form class="tarjeta acceso" id="formularioAcceso">
      <h1>Acceso profesorado</h1>
      <p class="subtitulo">Para crear y modificar actividades. Para consultarlas no hace falta.</p>
      <label class="campo">
        <span>Correo</span>
        <input type="text" id="correo" autocomplete="username" required>
      </label>
      <label class="campo">
        <span>Contraseña</span>
        <input type="password" id="contrasena" autocomplete="current-password" required>
      </label>
      <p class="error" id="error" role="alert"></p>
      <button type="submit" class="boton boton-principal" id="botonEntrar">Entrar</button>
    </form>
  </main>

  <footer class="pie">
    <a class="pie-marca" href="https://labelluco.github.io/abelluco/">
      <img src="img/abelluco.svg" alt="L'Abelluco" width="80" height="30">
    </a>
    <p>
      Un proyecto de <a href="https://labelluco.github.io/abelluco/">L'Abelluco</a>, libre para usar, adaptar y compartir.<br>
      Actividades: <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es" rel="license">CC BY-SA 4.0</a> ·
      Código: <a href="https://github.com/labelluco/hortescolar">AGPL-3.0</a>
    </p>
  </footer>

  <script type="module" src="js/interfaz/acceso.js"></script>
</body>
</html>
